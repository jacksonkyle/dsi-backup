services:
  dsi-backup:
    build: .
    restart: unless-stopped
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      # Name of the GCS bucket to store backups in
      GCS_BUCKET: your-bucket-name

      # Service account key JSON, base64-encoded.
      # Generate with:  base64 -w0 service-account.json
      # Store this in Dokploy's "Environment Variables" or a Docker secret.
      GCS_SERVICE_ACCOUNT_JSON: ""

      # ── Optional ──────────────────────────────────────────────────────────
      # GCS project ID (usually not required but useful for bucket creation)
      # GCS_PROJECT_ID: your-project-id

      # Where host volumes are mounted inside the container
      VOLUMES_PATH: /host-volumes

      # Docker stores volume data in a _data subdirectory; leave as "_data"
      # when using the host volumes mount below. Set to "" for explicit mounts.
      VOLUMES_DATA_SUBDIR: "_data"

      # Folder prefix inside the bucket (default: dokploy-backups)
      BACKUP_PREFIX: dokploy-backups

      # Label embedded in each archive filename to identify the host
      BACKUP_HOSTNAME: my-server

      # Cron schedule — default is 02:00 UTC every day
      BACKUP_SCHEDULE: "0 2 * * *"

      # Delete archives older than this many days (0 = keep forever)
      BACKUP_RETENTION_DAYS: "30"

      # Set to "true" to run a backup immediately when the container starts
      RUN_ON_STARTUP: "false"

    volumes:
      # Mount the entire Docker volumes directory from the host (read-only).
      # This gives the backup container access to ALL named volumes automatically —
      # no need to list them individually. Docker stores each volume's data at
      # /var/lib/docker/volumes/<name>/_data on the host.
      - /var/lib/docker/volumes:/host-volumes:ro

      # If you prefer to mount the service-account key as a file instead of
      # encoding it in GCS_SERVICE_ACCOUNT_JSON, uncomment the lines below
      # and set GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcs-key.json
      # - /path/to/service-account.json:/secrets/gcs-key.json:ro
